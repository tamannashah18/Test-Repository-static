name: Deploy to Azure

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Create and Configure Azure Storage Account
      run: |
        az group create --name staticazuretest3d6f0f-rg --location us-central1 || true
        az storage account create --name staticazuretest3d6f0f --resource-group staticazuretest3d6f0f-rg --location us-central1 --sku Standard_LRS --allow-blob-public-access true || true
        az storage blob service-properties update --account-name staticazuretest3d6f0f --static-website --404-document index.html --index-document index.html

    - name: Upload to Azure Storage $web container
      run: az storage blob upload-batch -d '$web' --account-name staticazuretest3d6f0f -s . --overwrite

    - name: Notify Success
      if: success()
      run: |
        curl -X POST https://rebuttal-slashing-glove.ngrok-free.dev/api/UnifiedDeployment/webhook/github -H "Content-Type: application/json" -d '{"deploymentId": "6a22bb4f947d2a03b10c6e9b", "status": "success"}'

    - name: Notify Failure
      if: failure()
      run: |
        curl -X POST https://rebuttal-slashing-glove.ngrok-free.dev/api/UnifiedDeployment/webhook/github -H "Content-Type: application/json" -d '{"deploymentId": "6a22bb4f947d2a03b10c6e9b", "status": "failed"}'
