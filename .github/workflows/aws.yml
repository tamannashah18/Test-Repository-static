name: Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Create and Configure S3 Bucket
      run: |
        aws s3api create-bucket --bucket test-repository-static-191afac4 --region us-east-1 || true
        aws s3api put-public-access-block --bucket test-repository-static-191afac4 --public-access-block-configuration BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
        sleep 5 # Wait for public access block removal to propagate
        aws s3api put-bucket-policy --bucket test-repository-static-191afac4 --policy '{"Version":"2012-10-17","Statement":[{"Sid":"PublicReadGetObject","Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::test-repository-static-191afac4/*"}]}'
        aws s3 website s3://test-repository-static-191afac4/ --index-document index.html --error-document index.html

    - name: Deploy to S3
      run: aws s3 sync ./dist s3://test-repository-static-191afac4 --delete

    - name: Notify Success
      if: success()
      run: |
        curl -X POST ${{ secrets.SWIFT_DEPLOY_WEBHOOK_URL }}/api/UnifiedDeployment/webhook/github -H "Content-Type: application/json" -H "ngrok-skip-browser-warning: true" -d '{"deploymentId": "6a33bcbccc7c640651a5b2f7", "status": "success"}'

    - name: Notify Failure
      if: failure()
      run: |
        curl -X POST ${{ secrets.SWIFT_DEPLOY_WEBHOOK_URL }}/api/UnifiedDeployment/webhook/github -H "Content-Type: application/json" -H "ngrok-skip-browser-warning: true" -d '{"deploymentId": "6a33bcbccc7c640651a5b2f7", "status": "failed"}'
