name: Deploy to GCP

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Create and Configure GCS Bucket
      run: |
        gcloud storage buckets create gs://test-repository-static-191afac4 --location=us-east1 --project=${{ secrets.GCP_PROJECT_ID }} || true
        gcloud storage buckets update gs://test-repository-static-191afac4 --web-main-page-suffix=index.html --web-error-page=index.html
        gcloud storage buckets add-iam-policy-binding gs://test-repository-static-191afac4 --member=allUsers --role=roles/storage.objectViewer

    - name: Deploy to GCS
      run: gcloud storage rsync . gs://test-repository-static-191afac4 --recursive --delete-unmatched-destination-objects
